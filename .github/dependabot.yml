version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    groups:
      dependencias-npm:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    groups:
      dependencias-actions:
        patterns:
          - '*'
