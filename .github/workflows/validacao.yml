name: Validação do ambiente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validacao-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade-e-testes:
    name: Formatação, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Conferir formatação
        run: npm run format:check

      - name: Executar lint
        run: npm run lint

      - name: Executar todos os testes
        run: npm test

      - name: Guardar diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: diagnosticos-playwright-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
