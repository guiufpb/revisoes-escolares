<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 454.93333333333334" role="img" aria-labelledby="title desc"><title id="title">Cena V30</title><desc id="desc">Registro 1: Sol, chão plano e placa de madeira opaca de pé; a sombra aparece do lado oposto ao Sol e ligada à base. Registro 2: a forma e a cor de uma flor aparecem através da parte fosca de uma divisória, mas sem detalhes nítidos. Registro 3: uma poça em piso impermeável passa por redução até secar, sem chuva, escoamento, infiltração ou retirada de água; os cartões iniciais mostram poça menor, poça maior e piso seco. Registro 4: placas iguais de mesmo material e espessura, uma bege-clara e outra marrom-escura, recebem a mesma exposição ao Sol durante o mesmo tempo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="452.93333333333334" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">1 · Sombra</text><g transform="translate(8 64) scale(0.47333333333333333)"><rect x="12" y="235" width="576" height="78" rx="0" fill="#e4d0a6" stroke="#b29268" stroke-width="3"/><path d="M106.0 66.0 L114.4 66.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M97.21320343559643 87.21320343559643 L103.15290039756343 93.15290039756343" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M76.0 96.0 L76.0 104.4" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M54.78679656440357 87.21320343559643 L48.84709960243657 93.15290039756343" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M46.0 66.0 L37.599999