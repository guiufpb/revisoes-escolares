<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Cena V22</title><desc id="desc">Forno solar em desenho simplificado. A identifica a tampa transparente, B a superfície refletora voltada para a abertura e C a superfície escura do interior. A luz solar chega à abertura diretamente e também pelo refletor. Um adulto cuida do uso do forno.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="318" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><rect x="225" y="192" width="305" height="105" rx="8" fill="#bf9565" stroke="#344354" stroke-width="3"/><rect x="250" y="224" width="255" height="55" rx="8" fill="#374149" stroke="#344354" stroke-width="3"/><rect x="235" y="177" width="285" height="18" rx="8" fill="#d9f2f7" stroke="#536b74" stroke-width="3"/><path d="M150 75 L244 149" fill="none" stroke="#7a8b95" stroke-width="15"/><path d="M110.0 31.0 L117.0 31.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M102.67766952966369 48.67766952966369 L107.62741699796952 53.62741699796952" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M85.0 56.0 L85.0 63.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M67.32233047033631 48.67766952966369 L62.37258300203048 53.62741699796952" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M60.0 31.000000000000004 L53.0 31.000000000000004" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M67.32233047033631 13.322330470336315 L62.37258300203047 8.372583002030481" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M85.0 6.0 L85.0 -1.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M102.67766952966369 13.322330470336308 L107.627416