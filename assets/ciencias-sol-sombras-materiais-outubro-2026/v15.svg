<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 174.13333333333333" role="img" aria-labelledby="title desc"><title id="title">Cena V15</title><desc id="desc">Três registros misturados do mesmo prato: no cartão 1 há cubos de gelo antes de começarem a derreter; no 2, apenas água líquida; no 3, pedaços menores de gelo com água líquida. A observação termina antes de o prato secar.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="172.13333333333333" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">Cartão 1</text><g transform="translate(8 64) scale(0.30666666666666664)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><rect x="234.0" y="158" width="52" height="52" rx="8" fill="#c2ecfa" stroke="#327ba2" stroke-width="3"/><rect x="291.0" y="158" width="52" height="52" rx="8" fill="#c2ecfa" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g></g><g transform="translate(200.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">Cartão 2</text><g transform="translate(8 64) scale(0.30666666666666664)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><ellipse cx="300" cy="220" rx="120" ry="24" fill="#75bad8" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g></g