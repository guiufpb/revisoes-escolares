<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 454.93333333333334" role="img" aria-labelledby="title desc"><title id="title">Cena V17</title><desc id="desc">Os panos S e H começaram iguais e com a mesma quantidade de água, ficaram pelo mesmo tempo e com a mesma circulação de ar. S recebeu mais aquecimento solar e terminou quase seco. H ficou à sombra e ainda estava úmido, mas tinha menos água que no começo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="452.93333333333334" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">S · Sol · Começo</text><g transform="translate(8 64) scale(0.47333333333333333)"><path d="M50 83 L550 83" fill="none" stroke="#344354" stroke-width="4"/><rect x="190" y="85" width="220" height="146" rx="8" fill="#f3e8ca" stroke="#344354" stroke-width="3"/><path d="M225 116 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M225 148 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M225 180 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M290 116 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M290 148 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M290 180 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M355 116 q-15 22 0 25 q15 -3 0 -25Z" fill="#69acd0" stroke="#327ba2" stroke-width="2"/><path d="M355 148 q-15