<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Cena V03</title><desc id="desc">Uma lanterna acesa ilumina uma figura de cartolina colocada entre a lanterna e uma parede. Na parede aparece a sombra da figura.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="318" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(84 151)"><rect x="-34" y="-14" width="55" height="28" rx="8" fill="#526879" stroke="#344354" stroke-width="3"/><path d="M21 -14 L38 -25 L38 25 L21 14Z" fill="#e6e9ef" stroke="#344354" stroke-width="3"/><path d="M41 0 L78 0" fill="none" stroke="#ad7000" stroke-width="5" marker-end="url(#arrow)"/></g><rect x="419" y="58" width="150" height="210" rx="8" fill="#e0e3e6" stroke="#344354" stroke-width="3"/><path d="M286 95 L340 192 L232 192 Z" fill="#e1c58f" stroke="#344354" stroke-width="4"/><path d="M164 151 L252 151" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><path d="M494 83 L557 210 L431 210Z" fill="#53606b"/><text x="90" y="278" font-size="22" text-anchor="middle">Lanterna</text><text x="292" y="278" font-size="22" text-anchor="middle">Figura</text><text x="495" y="301" font-size="22" text-anchor="middle">Parede</text></g></svg>