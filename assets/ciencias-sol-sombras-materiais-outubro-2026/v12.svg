<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Cena V12</title><desc id="desc">No teatro, a luz segue da esquerda para a direita. Há três espaços a organizar antes da plateia, que ficará à direita da tela. Os cartões disponíveis são figura opaca, tela que deixa passar luz espalhada e lanterna acesa, nessa ordem de apresentação.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="318" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><path d="M35 80 L440 80" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="110" width="110" height="80" rx="8" fill="none" stroke="#7b8e9c" stroke-width="3"/><rect x="170" y="110" width="110" height="80" rx="8" fill="none" stroke="#7b8e9c" stroke-width="3"/><rect x="310" y="110" width="110" height="80" rx="8" fill="none" stroke="#7b8e9c" stroke-width="3"/><g transform="translate(527 215) scale(0.65)"><circle cx="0" cy="-85" r="18" fill="#dca477" stroke="#344354" stroke-width="3"/><rect x="-21" y="-64" width="42" height="57" rx="8" fill="#6694bd" stroke="#344354" stroke-width="3"/><path d="M-11 -7 L-20 32" fill="none" stroke="#344354" stroke-width="4"/><path d="M11 -7 L20 32" fill="none" stroke="#344354" stroke-width="4"/></g><text x="529" y="280" font-size="24" text-anchor="middle">Plateia</text><text x="300" y="35" font-size="26" text-anchor="middle">Caminho da luz</text><text x="300" y="310" font-size="21" text-anchor="middle">Figura · Tela · Lanterna: cartões misturados</text></g></svg>