<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Cena V16</title><desc id="desc">Na sequência 1, o gelo diminui até restar água líquida no prato. Na sequência 2, a água líquida de outro prato vai diminuindo até o prato secar. Nada foi derramado, os pratos não vazaram e o tempo passou num ambiente aquecido.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="318" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><text x="300" y="30" font-size="28" text-anchor="middle">Sequência 1 · O tempo passa</text><g transform="translate(70 20) scale(.43)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><rect x="234.0" y="158" width="52" height="52" rx="8" fill="#c2ecfa" stroke="#327ba2" stroke-width="3"/><rect x="291.0" y="158" width="52" height="52" rx="8" fill="#c2ecfa" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g><path d="M278 105 L333 105" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(327 20) scale(.43)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><ellipse cx="300" cy="220" rx="120" ry="24" fill="#75bad8" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g><path d="M20 168 L580 168" fill="none" stroke="#aab9c4" stroke-width="2"/><text x="300" y="207" font-size="28" text-anchor="middle">Sequência 2 · O tempo passa</text><g transform="translate(0 204) scale(.32)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><ellipse cx="300" cy="220" rx="120" ry="24" fill="#75bad8" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g><g transform="translate(198 204) scale(.32)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><ellipse cx="300" cy="220" rx="60" ry="24" fill="#75bad8" stroke="#327ba2" stroke-width="3"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g><g transform="translate(396 204) scale(.32)"><ellipse cx="300" cy="225" rx="150" ry="38" fill="#fff" stroke="#344354" stroke-width="4"/><text x="300" y="45" font-size="26" text-anchor="middle"></text></g><path d="M168 275 L218 275" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><path d="M370 275 L420 275" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/></g></svg>