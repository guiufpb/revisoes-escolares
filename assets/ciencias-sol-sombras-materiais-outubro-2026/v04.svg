<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 227.46666666666667" role="img" aria-labelledby="title desc"><title id="title">Cena V04</title><desc id="desc">Duas montagens com o mesmo vaso e chão plano. Na cena 1, a lanterna acima do vaso fica à esquerda. Na cena 2, fica à direita. As sombras ainda não estão desenhadas.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="225.46666666666667" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">Cena 1</text><g transform="translate(8 64) scale(0.47333333333333333)"><rect x="12" y="235" width="576" height="78" rx="0" fill="#e4d0a6" stroke="#b29268" stroke-width="3"/><g transform="translate(300 245) scale(1)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><g transform="translate(80 108)"><rect x="-34" y="-14" width="55" height="28" rx="8" fill="#526879" stroke="#344354" stroke-width="3"/><path d="M21 -14 L38 -25 L38 25 L21 14Z" fill="#e6e9ef" stroke="#344354" stroke-width="3"/><path d="M41 0 L78 0" fill="none" stroke="#ad7000" stroke-width="5" marker-end="url(#arrow)"/></g></g></g><g transform="translate(300.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">Cena 2</text><g transform="translate(8 64) scale(0.47333333333333333)"><rect x="12" y="235" width="576" height="78" rx="0" fill="#e4d0a6" stroke="#b29268" stroke-width="3"/><g transform="translate(300 245) scale(1)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><g transform="translate(520 108) rotate(180)"><rect x="-34" y="-14" width="55" height="28" rx="8" fill="#526879" stroke="#344354" stroke-width="3"/><path d="M21 -14 L38 -25 L38 25 L21 14Z" fill="#e6e9ef" stroke="#344354" stroke-width="3"/><path d="M41 0 L78 0" fill="none" stroke="#ad7000" stroke-width="5" marker-end="url(#arrow)"/></g></g></g></g></svg>