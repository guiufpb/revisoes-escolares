<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 227.46666666666667" role="img" aria-labelledby="title desc"><title id="title">Cena V13</title><desc id="desc">Duas peças de cartolina grossa e opaca têm a mesma forma e espessura. Uma é branca; outra, azul. Cada peça será iluminada separadamente pela mesma lanterna de luz branca, na mesma posição, diante de tela branca.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="225.46666666666667" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">Peça branca</text><g transform="translate(8 64) scale(0.47333333333333333)"><g transform="translate(85 145)"><rect x="-34" y="-14" width="55" height="28" rx="8" fill="#526879" stroke="#344354" stroke-width="3"/><path d="M21 -14 L38 -25 L38 25 L21 14Z" fill="#e6e9ef" stroke="#344354" stroke-width="3"/><path d="M41 0 L78 0" fill="none" stroke="#ad7000" stroke-width="5" marker-end="url(#arrow)"/></g><rect x="410" y="76" width="16" height="174" rx="8" fill="#eff1f2" stroke="#344354" stroke-width="3"/><path d="M275 132 L304 180 L246 180Z" fill="#faf8ef" stroke="#344354" stroke-width="4"/><path d="M165 145 L242 145" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="293" font-size="22" text-anchor="middle">Luz branca · mesma montagem</text></g></g><g transform="translate(300.0 0.0)"><rect x="6" y="6" width="288.0" height="215.46666666666667" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="150.0" y="30" font-size="23" text-anchor="middle">Peça azul</text><g transform="translate(8 64) scale(0.47333333333333333)"><g transform="translate(85 145)"><rect x="-34" y="-14" width="55" height="28" rx="8" fill="#526879" stroke="#344354" stroke-width="3"/><path d="M21 -14 L38 -25 L38 25 L21 14Z" fill="#e6e9ef" stroke="#344354" stroke-width="3"/><path d="M41 0 L78 0" fill="none" stroke="#ad7000" stroke-width="5" marker-end="url(#arrow)"/></g><rect x="410" y="76" width="16" height="174" rx="8" fill="#eff1f2" stroke="#344354" stroke-width="3"/><path d="M275 132 L304 180 L246 180Z" fill="#4c82b8" stroke="#344354" stroke-width="4"/><path d="M165 145 L242 145" fill="none" stroke="#9d6200" stroke-width="4" marker-end="url(#arrow)"/><text x="300" y="293" font-size="22" text-anchor="middle">Luz branca · mesma montagem</text></g></g></g></svg>