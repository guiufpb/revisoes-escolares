<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 174.13333333333333" role="img" aria-labelledby="title desc"><title id="title">Cena V14</title><desc id="desc">Uma alça de silicone se curva com facilidade. Nina vê folhas com nitidez através de uma janela fechada. A alça de uma mochila suporta o peso dos materiais sem rasgar.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="172.13333333333333" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">a · Alça que se</text><text x="100.0" y="54" font-size="21" text-anchor="middle">curva</text><g transform="translate(8 64) scale(0.30666666666666664)"><path d="M140 210 Q180 20 300 125 Q425 230 455 100" fill="none" stroke="#597fa1" stroke-width="18"/></g></g><g transform="translate(200.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">b · Janela fechada</text><g transform="translate(8 64) scale(0.30666666666666664)"><rect x="185" y="75" width="230" height="165" rx="8" fill="#eff9ff" stroke="#536b74" stroke-width="3"/><g transform="translate(300 241) scale(0.55)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><path d="M300 191 L300 83" fill="none" stroke="#397744" stroke-width="7"/><path d="M300 121 q-65 -64 -68 -7 q31 30 68 7 M300 141 q64 -63 6