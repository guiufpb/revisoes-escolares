<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 174.13333333333333" role="img" aria-labelledby="title desc"><title id="title">Cena V27</title><desc id="desc">No diário inventado, a muda A recebeu água, mas ficou sem a luz necessária e apresentou ramos compridos e fracos. B recebeu água e luz adequadas e cresceu com folhas e ramos firmes. C recebeu luz, mas ficou sem água por muitos dias e apresentou folhas murchas.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="172.13333333333333" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">A · Água; sem luz</text><g transform="translate(8 64) scale(0.30666666666666664)"><g transform="translate(300 250) scale(0.55)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><path d="M300 195 Q285 125 315 55" fill="none" stroke="#7a8d42" stroke-width="5"/><path d="M300 125 q-45 -35 -45 5 q30 13 45 -5 M305 82 q35 -35 40 0 q-23 13 -40 0" fill="#b2bb70" stroke="#66773c" stroke-width="3"/></g></g><g transform="translate(200.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">B · Água e luz</text><g transform="translate(8 64) scale(0.30666666666666664)"><g transform="translate(300 250) scale(0.55)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><path d="M300 200 L300 92" fill="none" stroke="#397744" stroke-width="7"/><path d="M300 130 q-65 -64 -68 -7 q31 30 68 7 M300 150 q64 -63 68 -8 q-33 31 -68 8" fill="#64a96f" stroke="#397744" stroke-width="3"/></g></g><g transform="translate(400.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">C · Luz; sem água</text><g transform="translate(8 64) scale(0.30666666666666664)"><g transform="translate(300 250) scale(0.55)"><path d="M-45 -78 L45 -78 L30 0 L-30 0 Z" fill="#c7744b" stroke="#633b2c" stroke-width="4"/><rect x="-51" y="-90" width="102" height="17" rx="8" fill="#e69660" stroke="#633b2c" stroke-width="3"/></g><path d="M300 200 L300 92" fill="none" stroke="#397744" stroke-width="7"/><path d="M300 117 q-45 -10 -55 45 q50 4 55 -45 M300 144 q45 -8 55 38 q-45 9 -55 -38" fill="#729b52" stroke="#397744" stroke-width="3"/></g></g></g></svg>