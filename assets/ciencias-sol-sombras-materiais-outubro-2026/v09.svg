<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 174.13333333333333" role="img" aria-labelledby="title desc"><title id="title">Cena V09</title><desc id="desc">O mesmo carrinho está atrás de três placas que cobrem a mesma região. Pela placa 1, essa região aparece borrada. Pela placa 2, não vemos a parte atrás da placa. Pela placa 3, vemos essa parte com nitidez.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="172.13333333333333" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><g transform="translate(0.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">1</text><g transform="translate(8 64) scale(0.30666666666666664)"><text x="300" y="42" font-size="28" text-anchor="middle"></text><g filter="url(#blur)"><path d="M190 193 V157 H225 L247 128 H319 L340 157 H393 V193 Z" fill="#cd664a" stroke="#344354" stroke-width="4"/><rect x="252" y="136" width="58" height="24" rx="8" fill="#e6f6ff" stroke="#344354" stroke-width="3"/><circle cx="232" cy="193" r="17" fill="#344354" stroke="#344354" stroke-width="3"/><circle cx="352" cy="193" r="17" fill="#344354" stroke="#344354" stroke-width="3"/></g><rect x="167" y="102" width="246" height="125" rx="8" fill="none" stroke="#536b74" stroke-width="3"/><rect x="167" y="102" width="246" height="125" rx="8" fill="#edf4f7" fill-opacity=".2" stroke="#536b74" stroke-width="3"/></g></g><g transform="translate(200.0 0.0)"><rect x="6" y="6" width="188.0" height="162.13333333333333" rx="8" fill="#fff" stroke="#b7c3ce" stroke-width="3"/><text x="100.0" y="30" font-size="21" text-anchor="middle">2</text><g transform