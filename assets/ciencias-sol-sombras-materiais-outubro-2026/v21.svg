<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc"><title id="title">Cena V21</title><desc id="desc">Na observação de um adulto, a areia seca exposta ao Sol estava mais quente que a água do mar naquele momento. A água também recebia energia solar, e o registro não diz que estava gelada.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#9d6200"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter></defs><g font-family="Arial, sans-serif" fill="#253747"><rect x="1" y="1" width="598" height="318" rx="8" fill="#f2f8fc" stroke="#b7c3ce" stroke-width="3"/><path d="M120.0 70.0 L128.4 70.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M111.21320343559643 91.21320343559643 L117.15290039756343 97.15290039756343" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M90.0 100.0 L90.0 108.4" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M68.78679656440357 91.21320343559643 L62.84709960243657 97.15290039756343" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M60.0 70.0 L51.599999999999994 70.0" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M68.78679656440357 48.78679656440357 L62.84709960243657 42.84709960243657" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M90.0 40.0 L90.0 31.599999999999994" fill="none" stroke="#ad7000" stroke-width="3"/><path d="M111.21320343559643 48.78679656440357 L117.15290039756341 42.84709960243657" fill="none" stroke="#ad7000" stroke-width="3"/><circle cx="90" cy="70" r="24" fill="#ffcf57" stroke="#9d6200" stroke-width="3"/><rect x="15" y="162" width="285" height="135" rx="8" fill="#e9cc94" stroke="#344354" stroke-width="3"/><rect x="300" y="162" width="285" height="135" rx="8" fill="#86bdcf" stroke="#344354" stroke-width="3"/><text x="150" y="202" font-size="25" text-anchor="middle">Areia seca</text><text x="440" y