<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="titulo"><title id="titulo">Um anúncio guardado — inventado</title><rect width="680" height="390" rx="16" fill="#f4f0e7"/><g stroke="#334155" stroke-width="3" stroke-linejoin="round" font-family="Arial, sans-serif" fill="#172b40"><g stroke="none"><text x="26" y="36" font-size="24">Um anúncio guardado — inventado</text></g><rect x="34" y="57" width="277" height="288" rx="12" fill="#fff7e6"/><rect x="102" y="146" width="141" height="162" rx="12" fill="#e5e5e5"/><rect x="119" y="207" width="107" height="79" rx="12" fill="#565f66"/><circle cx="123" cy="184" r="5" fill="#334155"/><circle cx="155" cy="184" r="5" fill="#334155"/><circle cx="188" cy="184" r="5" fill="#334155"/><circle cx="219" cy="184" r="5" fill="#334155"/><ellipse cx="128" cy="147" rx="15" ry="6" fill="#334155"/><ellipse cx="215" cy="147" rx="15" ry="6" fill="#334155"/><rect x="333" y="83" width="318" height="226" rx="12" fill="#fff"/><g stroke="none"><text x="105" y="112" font-size="30">FOGÃO</text><text x="355" y="116" font-size="20">Ficha · relato inventado</text><text x="355" y="155" font-size="19">Naquele lugar e tempo,</text><text x="355" y="184" font-size="19">algumas famílias não</text><text x="355" y="213" font-size="19">tinham dinheiro para</text><text x="355" y="242" font-size="19">comprar o aparelho.</text></g></g></svg>
